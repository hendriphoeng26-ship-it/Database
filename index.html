<html lang="id">

<meta name="theme-color" content="#c22f1b">
<title>Harga Beli Bakmi Kelinci</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}

/* Layout: bar atas (merek + tab), area kerja satu kolom; panel samping untuk detail/ubah. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --sunk:#eceee9; --ink:#1c1b19; --muted:#686761; --line:#dfe0da;
  --accent:#c22f1b; --accent-ink:#ffffff; --accent-soft:#fbe5df;
  --ok:#1d7a4b; --ok-soft:#e1f2e8; --warn:#a96300; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe3e1; --info:#2a5d9f; --info-soft:#e3ecf8;
  --shadow:0 10px 30px rgba(30,25,20,.12);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131312; --surface:#1c1b19; --sunk:#232220; --ink:#ecebe6; --muted:#9e9c95; --line:#2f2e2b;
  --accent:#f06a4f; --accent-ink:#1a0e0b; --accent-soft:#3b1c16;
  --ok:#55c78c; --ok-soft:#173226; --warn:#e4a53e; --warn-soft:#352812; --bad:#f27b72; --bad-soft:#3a1b19; --info:#82aee8; --info-soft:#1a2738;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131312; --surface:#1c1b19; --sunk:#232220; --ink:#ecebe6; --muted:#9e9c95; --line:#2f2e2b;
  --accent:#f06a4f; --accent-ink:#1a0e0b; --accent-soft:#3b1c16;
  --ok:#55c78c; --ok-soft:#173226; --warn:#e4a53e; --warn-soft:#352812; --bad:#f27b72; --bad-soft:#3a1b19; --info:#82aee8; --info-soft:#1a2738;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}

/* bar atas */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 13px var(--f-mono)}
.brand h1{font-size:18px;line-height:1.1}
.brand small{display:block;font:500 12px var(--f-body);color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{background:var(--sunk);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.count{font:600 11px var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:1px 7px}
.count:empty{display:none}

main{padding-block:22px 60px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--info-soft);color:var(--info);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:14px}
.banner b{color:var(--ink)}
.banner button{margin-left:auto}

/* ringkasan */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}
.stat:hover{border-color:var(--muted)}
.stat .n{font:600 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.stat.on{outline:2px solid var(--ink);outline-offset:-1px}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 220px;min-width:0}
.input,select.input{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 11px;min-height:38px;width:100%}
.input:focus,button:focus-visible,.stat:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select.input{width:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;min-height:38px;cursor:pointer;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px}

/* tabel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
td.num,th.num{text-align:right}
td.kode{font:12.5px var(--f-mono);color:var(--muted);white-space:nowrap}
td.nama{font-weight:600;min-width:200px}
.price{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.price.empty{color:var(--muted);font-weight:400}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 14px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}

.pill{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--f-body);border-radius:20px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-mute{background:var(--sunk);color:var(--muted)}
.delta{font:500 12px var(--f-mono)} .up{color:var(--bad)} .down{color:var(--ok)}
.tag{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:2px 7px;white-space:nowrap}

/* bon masuk */
.bon-layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.bon-layout{grid-template-columns:minmax(0,1fr)}}
.bon-list{display:flex;flex-direction:column;max-height:calc(100vh - 220px);overflow:auto}
.bon-card{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:12px 14px;cursor:pointer;display:grid;gap:3px}
.bon-card:hover{background:var(--sunk)} .bon-card.on{background:var(--accent-soft)}
.bon-card .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.bon-card b{font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bon-card small{color:var(--muted);font-size:12.5px}
.bon-head{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;padding:16px;border-bottom:1px solid var(--line)}
.bon-head .meta{flex:1 1 260px;min-width:0;display:grid;gap:6px}
.bon-head h2{font-size:22px}
.kv{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)} .kv b{color:var(--ink);font-weight:600}
.thumb{width:150px;max-width:100%;aspect-ratio:3/4;border-radius:8px;border:1px solid var(--line);background:var(--sunk) center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:8px;cursor:zoom-in}
.items td{vertical-align:top}
.items .nb{font-weight:600}
.items .sub{font-size:12.5px;color:var(--muted)}
.items input.input{min-height:32px;padding:5px 8px;font-size:13.5px}
.items .pick{min-width:230px}
.items .hp{width:120px;text-align:right;font-family:var(--f-mono)}
.conf{display:inline-block;width:42px;height:6px;border-radius:4px;background:var(--sunk);vertical-align:middle;overflow:hidden}
.conf i{display:block;height:100%}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.actions .sp{margin-right:auto;font-size:13px;color:var(--muted)}
.note{margin:0 16px 14px;font-size:13.5px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px}
.empty-state{padding:40px 20px;text-align:center;color:var(--muted)}
.empty-state h3{color:var(--ink);font-size:18px;margin-bottom:6px}

/* panel samping */
.scrim{position:fixed;inset:0;background:rgba(10,10,10,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer .dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer .dh h2{font-size:20px}
.drawer .db{padding:16px 18px;overflow:auto;display:grid;gap:14px;align-content:start}
.drawer .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.field{display:grid;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigprice{font:600 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.hist{display:grid;gap:0}
.hist div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;align-items:baseline}
.spark{width:100%;height:70px;display:block}
.photo-view{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.photo-view img{max-height:94vh;border-radius:6px}

/* login */
.login{max-width:380px;margin:8vh auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:14px}
.login h2{font-size:24px}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;display:grid;gap:8px;width:min(420px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:14px;box-shadow:var(--shadow)}
.toast.err{background:var(--bad);color:#fff}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.set-grid .panel{padding:18px;display:grid;gap:12px;align-content:start}
.set-grid h3{font-size:17px}
.hint{font-size:13px;color:var(--muted)}
code{font-family:var(--f-mono);font-size:.9em;background:var(--sunk);padding:1px 5px;border-radius:4px}
@media (max-width:640px){
  .items thead{display:none}
  .items tr{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:6px 8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .items td{padding:0;border:0;min-width:0}
  .items td:nth-child(1){grid-row:1/4}
  .items td:nth-child(2){grid-column:2}
  .items td:nth-child(5){grid-column:3;grid-row:1}
  .items td.pick,.items td.num{grid-column:2/4;min-width:0;text-align:left}
  .items .pick{min-width:0}
  .items td.num .sub{display:inline;margin-left:8px}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
@media (max-width:560px){.top .wrap{gap:8px}.brand small{display:none}td.kode{display:none}th.kode{display:none}.thumb{width:96px}.bon-head h2{font-size:19px}}
</style>
</head>

  let userEmail = "";
  api = {
    sb,

    async simpanProduk(p) {
      const row = { kode: p.kode, nama: p.nama, kategori: p.kategori || null, unit: p.unit || null, vendor: p.vendor || null, aktif: p.aktif !== false };
      if (p.id) return ok(await sb.from("produk").update({ ...row, updated_at: new Date().toISOString() }).eq("id", p.id).select().single());
      return ok(await sb.from("produk").insert({ ...row, lokasi: cfg.LOKASI }).select().single());
    },
    async ubahHarga(id, harga, vendor, catatan, sumber = "manual") {
      ok(await sb.rpc("ubah_harga", { p_produk_id: id, p_harga: harga, p_vendor: vendor || null, p_sumber: sumber, p_oleh: userEmail, p_catatan: catatan || null }));
    },

      let q = sb.from("riwayat_harga").select("*, produk:produk_id(kode,nama,unit)").order("created_at", { ascending: false });

      const items = ok(await sb.from("bon_item").select("*").eq("bon_id", id).order("urutan"));
      let foto = null;

      return { bon, items, foto };

    async ubahItem(id, patch) { ok(await sb.from("bon_item").update(patch).eq("id", id)); },

    async scan(file) {
      const data = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = rej; fr.readAsDataURL(file); });
      const { data: s } = await sb.auth.getSession();
      const r = await fetch(`${cfg.SUPABASE_URL}/functions/v1/${cfg.FUNCTION}`, { method: "POST",
        headers: { "content-type": "application/json", authorization: "Bearer " + s.session.access_token, apikey: cfg.ANON_KEY },
        body: JSON.stringify({ action: "scan", data, media_type: file.type || "image/jpeg", lokasi: cfg.LOKASI }) });

    listen(cb) { sb.channel("bon").on("postgres_changes", { event: "*", schema: "public", table: "bon_masuk" }, cb).subscribe(); },
  };

function deltaHtml(a, b) { if (!a || b == null) return ""; const p = (b - a) / a * 100; if (Math.abs(p) < .05) return `<span class="delta muted">0%</span>`;

function sparkline(r) {
  const pts = [...r].reverse(); const v = [pts[0].harga_lama ?? pts[0].harga_baru, ...pts.map(x => x.harga_baru)].map(Number);
  if (v.length < 2) return ""; const W = 440, H = 70, pad = 8, mn = Math.min(...v), mx = Math.max(...v), rg = mx - mn || 1;
  const xy = v.map((y, i) => [pad + i * (W - 2 * pad) / (v.length - 1), H - pad - (y - mn) / rg * (H - 2 * pad)]);
  const line = xy.map(p => p.join(",")).join(" "), last = xy[xy.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Grafik riwayat harga">
    <polygon points="${pad},${H} ${line} ${W - pad},${H}" fill="var(--accent-soft)"/><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4" fill="var(--accent)"/></svg>`;
}

/* ---- CSV (format sama dengan ekspor Runchise) ---- */
function eksporCsv() {
  const q = s => /[",\n]/.test(s) ? `"${String(s).replace(/"/g, '""')}"` : s;
  const L = [`Harga Beli Produk_Bakmi Kelinci_${cfg.LOKASI}`, `Lokasi,${cfg.LOKASI}`, "Kode produk,Nama produk,Vendor,Harga Beli,Unit",
    ...S.produk.map(p => [p.kode, p.nama, p.vendor ?? "", p.harga_beli ?? "", p.unit ?? ""].map(x => q(String(x))).join(","))];
  const blob = new Blob([L.join("\n") + "\n"], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `Harga_Beli_Produk_Bakmi_Kelinci_${cfg.LOKASI.replace(/\W+/g, "_")}_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
  toast("File CSV dibuat");
}
function parseCsv(t) {
  const rows = []; let r = [], f = "", qt = false;
  for (let i = 0; i < t.length; i++) { const c = t[i];
    if (qt) { if (c === '"' && t[i + 1] === '"') { f += '"'; i++; } else if (c === '"') qt = false; else f += c; }
    else if (c === '"') qt = true; else if (c === ",") { r.push(f); f = ""; } else if (c === "\n" || c === "\r") { if (c === "\r" && t[i + 1] === "\n") i++; r.push(f); rows.push(r); r = []; f = ""; } else f += c; }
  if (f || r.length) { r.push(f); rows.push(r); } return rows;
}
$("#fileCsv").onchange = async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  const rows = parseCsv(await file.text()); const h = rows.findIndex(r => /kode produk/i.test(r[0] ?? ""));
  if (h < 0) return toast("Format tidak dikenali. Baris judul harus: Kode produk,Nama produk,Vendor,Harga Beli,Unit", true);
  let tambah = 0, harga = 0;
  try {
    for (const [kode, nama, vendor, hb, unit] of rows.slice(h + 1).filter(r => r[0]?.trim())) {
      const p = S.produk.find(x => x.kode.toLowerCase() === kode.trim().toLowerCase()); const n = angka(hb);
      if (!p) { await api.simpanProduk({ kode: kode.trim(), nama: nama.trim(), unit: unit?.trim(), vendor: vendor?.trim() }); tambah++; continue; }
      if (n != null && Number(p.harga_beli) !== n) { await api.ubahHarga(p.id, n, vendor?.trim(), "Impor " + file.name, "import"); harga++; }
    }
    await muatProduk(); render(); toast(`Impor selesai: ${harga} harga diperbarui, ${tambah} produk baru`);
  } catch (err) { toast(err.message, true); }
};

async function perkecil(file) {   // foto HP sering >4 MB; perkecil ke sisi terpanjang 2000 px
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 1.5e6) return file;
  const img = await createImageBitmap(file); const k = Math.min(1, 2000 / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = img.width * k; c.height = img.height * k; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(b => r(new File([b], "bon.jpg", { type: "image/jpeg" })), "image/jpeg", .85));
}

    <section class="panel"><h3>Koneksi database</h3>
      <div class="field"><label for="cUrl">Supabase URL</label><input class="input mono" id="cUrl" value="${esc(cfg.SUPABASE_URL)}"></div>
      <div class="field"><label for="cKey">Anon key</label><input class="input mono" id="cKey" value="${esc(cfg.ANON_KEY)}" placeholder="eyJhbGciOi…"></div>
      <div class="row2"><div class="field"><label for="cLok">Lokasi</label><input class="input" id="cLok" value="${esc(cfg.LOKASI)}"></div>
      <div class="field"><label for="cFn">Nama Edge Function</label><input class="input mono" id="cFn" value="${esc(cfg.FUNCTION)}"></div></div>
      <div class="hint">Disimpan di browser ini. Supaya permanen untuk semua perangkat, isi juga <code>CONFIG</code> di bagian atas file <code>index.html</code>.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="cSave">Simpan & muat ulang</button><button class="btn ghost" id="cReset">Kembali ke bawaan</button></div></section>
    <section class="panel"><h3>Akun</h3>
      <div>${api.demo ? "Belum terhubung (mode contoh)." : `Masuk sebagai <b>${esc(api.user())}</b>`}</div>
      ${api.demo ? "" : `<div><button class="btn" id="bOut">Keluar</button></div>`}
      <div class="hint">Akun pengguna dibuat di Supabase → Authentication → Users (akun yang sama dengan aplikasi BK Ops bisa dipakai).</div></section>
    <section class="panel" style="grid-column:1/-1"><h3>Akses bot Telegram</h3>
      <div class="hint">Hanya chat yang terdaftar dan aktif yang boleh mengirim bon. Ketik <code>/id</code> ke bot untuk melihat Chat ID. Untuk grup, tambahkan bot ke grup lalu ketik <code>/id</code> di grup (ID grup diawali tanda minus).</div>
      <div class="toolbar" style="margin:0"><input class="input mono" id="aId" placeholder="Chat ID, mis. 123456789" style="max-width:220px" inputmode="numeric"><input class="input" id="aNama" placeholder="Nama, mis. Admin CK" style="max-width:240px"><button class="btn primary" id="aAdd">Tambah</button></div>
      <div class="scroll"><table><thead><tr><th>Chat ID</th><th>Nama</th><th>Status</th><th></th></tr></thead><tbody id="aTb"></tbody></table></div></section>
  </div>`;
  $("#cSave").onclick = () => { store.set("bk_harga_cfg", { SUPABASE_URL: $("#cUrl").value.trim(), ANON_KEY: $("#cKey").value.trim(), LOKASI: $("#cLok").value.trim() || "CK - N1", FUNCTION: $("#cFn").value.trim() || "bon-bot" }); location.reload(); };
  $("#cReset").onclick = () => { store.set("bk_harga_cfg", {}); location.reload(); };
  if ($("#bOut")) $("#bOut").onclick = async () => { await api.logout(); location.reload(); };
  const isi = async () => { const a = await api.akses();
    $("#aTb").innerHTML = a.map(x => `<tr data-id="${x.chat_id}"><td class="mono">${x.chat_id}</td><td>${esc(x.nama ?? "")}</td>
      <td><span class="pill ${x.aktif ? "p-ok" : "p-mute"}">${x.aktif ? "Aktif" : "Nonaktif"}</span></td>
      <td style="text-align:right;white-space:nowrap"><button class="btn sm tg">${x.aktif ? "Nonaktifkan" : "Aktifkan"}</button> <button class="btn sm danger del">Hapus</button></td></tr>`).join("")
      || `<tr><td colspan="4" class="muted">Belum ada chat terdaftar.</td></tr>`;
    $$("#aTb .tg").forEach(b => b.onclick = async () => { const id = +b.closest("tr").dataset.id, x = a.find(y => y.chat_id === id); await api.simpanAkses({ chat_id: id, nama: x.nama, aktif: !x.aktif }); isi(); });
    $$("#aTb .del").forEach(b => b.onclick = async () => { const tr = b.closest("tr");
      if (b.dataset.yakin) { await api.hapusAkses(+tr.dataset.id); isi(); } else { b.dataset.yakin = 1; b.textContent = "Yakin hapus?"; } }); };
  $("#aAdd").onclick = async () => { const id = parseInt($("#aId").value.replace(/[^\d-]/g, ""), 10); if (!id) return toast("Isi Chat ID berupa angka", true);
    try { await api.simpanAkses({ chat_id: id, nama: $("#aNama").value.trim() || null, aktif: true }); $("#aId").value = $("#aNama").value = ""; toast("Chat ditambahkan"); isi(); } catch (e) { toast(e.message, true); } };
  isi();
}

/* ===================== MULAI ===================== */
function loginView(err) {
  $("nav.tabs").hidden = true;
  $("#app").innerHTML = `<form class="login" id="fl"><h2>Masuk</h2><div class="muted">Database harga beli Bakmi Kelinci</div>
    <div class="field"><label for="le">Email</label><input class="input" id="le" type="email" autocomplete="username" required></div>
    <div class="field"><label for="lp">Kata sandi</label><input class="input" id="lp" type="password" autocomplete="current-password" required></div>
    ${err ? `<div class="note" style="margin:0">${esc(err)}</div>` : ""}<button class="btn primary">Masuk</button>
    <button type="button" class="btn ghost" id="lCfg">Ubah koneksi database</button></form>`;
  $("#fl").onsubmit = async e => { e.preventDefault(); try { await api.login($("#le").value, $("#lp").value); location.reload(); } catch (x) { loginView("Email atau kata sandi salah. " + x.message); } };
  $("#lCfg").onclick = () => { $("nav.tabs").hidden = false; viewAtur($("#app")); };
}
(async function start() {
  $("#lokasiLbl").textContent = "Bakmi Kelinci · " + cfg.LOKASI;
  try {
    if (!(await api.session())) return loginView();
    await Promise.all([muatProduk(), muatBon()]);
    const m = location.hash.match(/bon[=-]([\w-]+)/); if (m) { S.bonId = m[1]; S.view = "bon"; }
    go(S.view);
    api.listen(async ch => { await muatBon(); if (ch.eventType === "INSERT") toast(`Bon baru dari ${ch.new.pengirim ?? "Telegram"} sedang dibaca…`);
      if (ch.eventType === "UPDATE" && ch.new.status === "menunggu") toast(`Bon ${ch.new.vendor ?? ""} siap diperiksa`);
      if (S.view === "bon") { const cur = S.bonId; render(); S.bonId = cur; } });
  } catch (e) { $("#app").innerHTML = `<div class="empty-state"><h3>Tidak bisa terhubung ke database</h3>${esc(e.message)}<br><br><button class="btn" onclick="go('atur')">Buka Pengaturan</button></div>`; }
})();
</script>
</body>
</html>
